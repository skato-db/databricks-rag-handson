command: ["uv", "run", "start-server"]
# databricks apps listen by default on port 8000
#
# ハンズオン用の設定。1-2 のノートブックが値を書き換える。
#   AI_SEARCH_INDEX: 1-1 で作った AI Search の索引（<catalog>.<schema>.<index>）
#   LLM_ENDPOINT:    回答に使う Foundation Model API のエンドポイント
# agentbricks deploy は tracing などの env を追記し、ここに書いた env は残す。
env:
  - name: AI_SEARCH_INDEX
    value: "main.rag_handson.docs_chunks_index"
  - name: LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-5"
